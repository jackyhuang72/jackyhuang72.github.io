<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分科入學排行榜</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #0ea5e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin: 0 0 2rem;
      font-size: 2rem;
      color: var(--accent);
      text-shadow: 0 0 16px rgba(14, 165, 233, 0.35);
      text-align: center;
    }

    .years {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      width: 100%;
      max-width: 600px;
    }

    .year-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 160px;
      height: 160px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .year-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 0 24px rgba(14, 165, 233, 0.25);
    }

    .year-card .year {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
    }

    .year-card .label {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      padding: 0 0.5rem;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      .year-card {
        width: 140px;
        height: 140px;
      }
      .year-card .year { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <h1>分科入學排行榜</h1>
  <nav class="years">
    
        <a class="year-card" href="./113.html">
          <span class="year">113</span>
          <span class="label">分科入學平均分排行榜</span>
        </a>
      
        <a class="year-card" href="./114.html">
          <span class="year">114</span>
          <span class="label">分科入學平均分排行榜</span>
        </a>
      
  </nav>
</body>
</html>
